name: Customer Churn CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate Python files
        run: |
          python -m compileall -q app preprocessing.py train_model.py train_models.py tests

      - name: Run automated tests
        run: |
          python -m pytest tests/ -v

      - name: Build validation
        run: |
          echo "Customer Churn Prediction CI build completed successfully!"